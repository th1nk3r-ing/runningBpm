name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Build & publish release APK to GitHub Releases'
        type: boolean
        default: false

jobs:
  cpp-tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run engine test with ThreadSanitizer
        run: |
          cmake -S cpp -B "${RUNNER_TEMP}/runbeat-cpp-tsan" \
            -DBUILD_TESTING=ON -DRUNBEAT_TSAN=ON
          cmake --build "${RUNNER_TEMP}/runbeat-cpp-tsan" --target engine_test --parallel
          ctest --test-dir "${RUNNER_TEMP}/runbeat-cpp-tsan" \
            -R '^engine_test$' --output-on-failure

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test C++ core
        run: |
          cmake -S cpp -B "${RUNNER_TEMP}/runbeat-cpp-tests" -DBUILD_TESTING=ON
          cmake --build "${RUNNER_TEMP}/runbeat-cpp-tests" --parallel
          ctest --test-dir "${RUNNER_TEMP}/runbeat-cpp-tests" --output-on-failure

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK components
        run: |
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install \
            "platforms;android-34" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: android

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Prepare release signing keystore
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        env:
          RUNBEAT_RELEASE_KEYSTORE_BASE64: ${{ secrets.RUNBEAT_RELEASE_KEYSTORE_BASE64 }}
          RUNBEAT_RELEASE_STORE_PASSWORD: ${{ secrets.RUNBEAT_RELEASE_STORE_PASSWORD }}
          RUNBEAT_RELEASE_KEY_ALIAS: ${{ secrets.RUNBEAT_RELEASE_KEY_ALIAS }}
          RUNBEAT_RELEASE_KEY_PASSWORD: ${{ secrets.RUNBEAT_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RUNBEAT_RELEASE_KEYSTORE_BASE64" ] || \
             [ -z "$RUNBEAT_RELEASE_STORE_PASSWORD" ] || \
             [ -z "$RUNBEAT_RELEASE_KEY_ALIAS" ] || \
             [ -z "$RUNBEAT_RELEASE_KEY_PASSWORD" ]; then
            echo "::error::Configure the RUNBEAT_RELEASE_* GitHub Actions secrets before publishing a release."
            exit 1
          fi
          printf '%s' "$RUNBEAT_RELEASE_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/runbeat-release.jks"

      - name: Build release APK (for publish)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        env:
          RUNBEAT_RELEASE_STORE_FILE: ${{ runner.temp }}/runbeat-release.jks
          RUNBEAT_RELEASE_STORE_PASSWORD: ${{ secrets.RUNBEAT_RELEASE_STORE_PASSWORD }}
          RUNBEAT_RELEASE_KEY_ALIAS: ${{ secrets.RUNBEAT_RELEASE_KEY_ALIAS }}
          RUNBEAT_RELEASE_KEY_PASSWORD: ${{ secrets.RUNBEAT_RELEASE_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease -PversionCode="$VERSION_CODE"
        working-directory: android

      - name: Upload release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android/app/build/outputs/apk/release/*.apk

  release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          tag_name: v${{ github.run_number }}
          generate_release_notes: true
