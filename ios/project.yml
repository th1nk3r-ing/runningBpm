name: RunBeatPro
options:
  bundleIdPrefix: com.runbeat
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top
  knownRegions:
    - zh
    - en
    - Base

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_OBJC_BRIDGING_HEADER: RunBeatPro/Bridge/RunBeatPro-Bridging-Header.h
    CLANG_ENABLE_MODULES: YES
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    HEADER_SEARCH_PATHS:
      - "$(SRCROOT)/../cpp/core"
      - "$(inherited)"

targets:
  RunBeatPro:
    type: application
    platform: iOS
    sources:
      - path: RunBeatPro
        type: group
        createIntermediateGroups: true
      # C++ Core 头文件（header-only，通过 HEADER_SEARCH_PATHS 引用）
      - path: ../cpp/core
        type: group
        createIntermediateGroups: true
        buildPhase: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.runbeat.pro
        INFOPLIST_FILE: RunBeatPro/Info.plist
        DEVELOPMENT_TEAM: ""
        SWIFT_OBJC_INTERFACE_HEADER_NAME: RunBeatPro-Swift.h
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: "Copy WAV Resources"
        script: |
          SRC_DIR="${SRCROOT}/../android/app/src/main/assets/sounds"
          DST_DIR="${SRCROOT}/RunBeatPro/Resources/sounds"
          if [ -d "$SRC_DIR" ]; then
            rsync -aq --delete "$SRC_DIR/" "$DST_DIR/"
            echo "Copied WAV resources from $SRC_DIR"
          else
            echo "Warning: Source sounds directory not found at $SRC_DIR"
          fi
        basedOnDependencyAnalysis: false
