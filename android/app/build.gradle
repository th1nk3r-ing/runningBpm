plugins {
    id 'com.android.application'
}

def getGitCommit() {
    try {
        return "git describe --always".execute(null, project.rootDir).text.trim()
    } catch (Exception e) {
        return "unknown"
    }
}

def releaseVersionCode = (project.findProperty('versionCode') ?: '1').toString().toInteger()
def releaseStoreFilePath = System.getenv('RUNBEAT_RELEASE_STORE_FILE')
def releaseStorePassword = System.getenv('RUNBEAT_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('RUNBEAT_RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('RUNBEAT_RELEASE_KEY_PASSWORD')
def releaseSigningConfigured = releaseStoreFilePath && releaseStorePassword &&
        releaseKeyAlias && releaseKeyPassword

if (releaseStoreFilePath && !releaseSigningConfigured) {
    throw new GradleException('RUNBEAT_RELEASE_STORE_FILE requires all RUNBEAT_RELEASE_* signing values.')
}

android {
    namespace 'com.runbeat.pro'
    compileSdk 34
    buildFeatures { buildConfig true }
    lint { checkReleaseBuilds = false }

    defaultConfig {
        applicationId "com.runbeat.pro"
        minSdk 26
        targetSdk 34
        versionCode releaseVersionCode
        versionName "1.0"
        buildConfigField "String", "BUILD_TIME", "\"${new Date().format('yyyy-MM-dd HH:mm:ss')}\""
        buildConfigField "String", "GIT_COMMIT", "\"${getGitCommit()}\""
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Without release secrets, build an unsigned APK so local minify checks still work.
            if (releaseSigningConfigured) signingConfig signingConfigs.release
        }
    }

    android.applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            def unsignedSuffix = variant.buildType.name == 'release' && !releaseSigningConfigured
                    ? '-unsigned' : ''
            outputFileName = "RunBeatPro-v${defaultConfig.versionName}-${getGitCommit()}-${variant.buildType.name}${unsignedSuffix}.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    ndkVersion = '25.2.9519653'
    externalNativeBuild {
        cmake {
            path "../../cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') {
            because 'Force Kotlin stdlib version to avoid duplicates'
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') {
            because 'Force Kotlin stdlib version to avoid duplicates'
        }
    }
}
